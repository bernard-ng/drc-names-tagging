baseline_experiments:
  - name: markov
    description: Character-transition baseline for native/foreign token tagging.
    tagger_type: markov
    tagger_params:
      native_transition: data/native_transition.csv
      foreign_transition: data/foreign_transition.csv
    tags: [baseline, probabilistic, character]
    cpu_workers: 10
    batch_size: 4096
    resume: true
    checkpoint_key: markov-v1
    sample_fraction: 1
    limit: 1000

  - name: ollama_mistral_7b
    description: Structured-output native/foreign annotation with local Mistral 7B.
    tagger_type: ollama
    tagger_params:
      ollama_model: mistral:7b
      ollama_url: http://localhost:11434
      ollama_timeout: 240.0
    tags: [llm, structured_output, local]
    concurrency: 4
    # Larger batches are supported, but changed labels in the local benchmark.
    batch_size: 1
    retries: 2
    resume: true
    checkpoint_key: mistral-7b-v1
    sample_fraction: 1
    limit: 1000

advanced_experiments: []

token_workflow:
  # The LLM labels are retained as the preferred training labels for the first phase.
  reference_tagger: ollama_mistral_7b
